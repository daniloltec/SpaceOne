name: spaceone

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-spaceone}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spaceone}
      POSTGRES_DB: ${POSTGRES_DB:-spaceone}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-spaceone} -d ${POSTGRES_DB:-spaceone}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-spaceone}:${POSTGRES_PASSWORD:-spaceone}@db:5432/${POSTGRES_DB:-spaceone}
      TZ: America/Fortaleza
      PORT: 3000
      UPLOAD_DIR: /data/uploads
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/saude').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["worker"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-spaceone}:${POSTGRES_PASSWORD:-spaceone}@db:5432/${POSTGRES_DB:-spaceone}
      TZ: America/Fortaleza
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
